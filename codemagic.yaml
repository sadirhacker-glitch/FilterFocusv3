workflows:
  android-build:
    name: Build FocusFilter APK
    environment:
      java: 17
    scripts:
      - name: Unpack project
        script: |
          tar -xf FocusFilter_v3_improved.tar.gz-1
          echo "=== Current directory ==="
          pwd
          ls -la
          echo "=== Looking for gradlew ==="
          find . -name "gradlew" -type f
          echo "=== Looking for build.gradle ==="
          find . -name "build.gradle" -type f
      - name: Build APK
        script: |
          cd FocusFilter
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
    artifacts:
      - FocusFilter/app/build/outputs/apk/debug/*.apk
